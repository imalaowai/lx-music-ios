<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="音乐分享"><meta name="theme-color" content="#f5f5f7"><meta name="referrer" content="no-referrer"><title>音乐分享</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="/share/assets/apple-touch-icon.png"><link rel="icon" href="/share/assets/icon-192.png"><link rel="stylesheet" href="/share/assets/player.css"></head><body>
<header class="share-header"><a href="#" id="share-top">♫ <span>音乐分享</span></a><button type="button" id="pwa-install-btn">添加到主屏幕</button></header>
<main><section id="share-gate" class="share-gate"><span class="share-mark">♫</span><h1 id="gate-title">正在打开音乐分享</h1><p id="gate-description">正在读取歌单…</p><form id="share-password-form" hidden><input id="share-password" type="password" autocomplete="current-password" maxlength="128" placeholder="输入分享密码" aria-label="分享密码"><button>打开歌单</button></form><p id="gate-status" role="status"></p></section>
<section id="share-content" hidden><div class="share-hero"><img id="share-poster" src="/share/assets/icon-192.png" alt="歌单封面"><div><small>分享的音乐</small><h1 id="share-title"></h1><p id="share-count"></p><button id="share-play-all" type="button">▶ 播放全部</button><button id="share-download-all" type="button" hidden>下载歌单</button></div></div><div class="share-list-heading"><h2>歌曲</h2><input id="share-filter" type="search" placeholder="搜索歌曲或歌手" aria-label="搜索歌曲或歌手"></div><div id="share-tracks"></div></section></main>
<footer id="share-player" hidden><div class="share-now"><img id="share-now-cover" src="/share/assets/icon-192.png" alt="封面"><div><strong id="share-now-title">选择一首音乐</strong><small id="share-now-artist"></small><span id="share-play-status" role="status"></span></div></div><div class="share-transport"><div><span id="share-current">0:00</span><input type="range" id="share-seek" min="0" max="1000" value="0" aria-label="播放进度"><span id="share-duration">0:00</span></div><div class="share-buttons"><button id="share-prev" title="上一首" aria-label="上一首">◀◀</button><button id="share-toggle" title="播放" aria-label="播放">▶</button><button id="share-next" title="下一首" aria-label="下一首">▶▶</button><button id="share-download" hidden title="下载当前歌曲" aria-label="下载当前歌曲">↓</button></div></div></footer>
<audio id="share-audio" preload="metadata" playsinline></audio><script src="/share/assets/queue-audio.js"></script><script src="/share/assets/browser-downloads.js"></script><script src="/share/assets/download-options.js"></script><script src="/share/assets/player.js"></script><script src="/share/assets/pwa.js"></script></body></html>
