name: Build CarPlay PhoneFix V8

on:
  push:
    branches: [carplay-phonefix-v8-20260901]
    paths-ignore:
      - 'build-info/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carplay-phonefix-v8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build TrollStore CarPlay PhoneFix V8
    runs-on: macos-14
    env:
      NO_FLIPPER: 1
      IOS_SCHEME: LxMusicMobile
      IOS_WORKSPACE: ios/LxMusicMobile.xcworkspace
      IOS_BUNDLE_IDENTIFIER: com.klxmc.music.mobile
      DERIVED_DATA_PATH: build/DerivedData
      CARPLAY_ENTITLEMENTS: ios/LxMusicMobile/LxMusicMobile.entitlements

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply V8 phone startup isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 .carplay-build/apply_carplay_phonefix_v8.py
          plutil -lint ios/LxMusicMobile/Info.plist
          plutil -lint "$CARPLAY_ENTITLEMENTS"

          grep -q 'MPPlayableContentManager' ios/LxMusicMobile/main.m
          grep -q 'activateWithResolver' ios/LxMusicMobile/main.m
          ! grep -q '__attribute__((constructor))' ios/LxMusicMobile/main.m
          ! grep -q 'configurationForConnectingSceneSession' ios/LxMusicMobile/main.m
          ! grep -q 'CPTemplateApplicationScene' ios/LxMusicMobile/main.m
          ! grep -q 'LXPhoneSceneDelegate' ios/LxMusicMobile/main.m

          if /usr/libexec/PlistBuddy -c 'Print :UIApplicationSceneManifest' ios/LxMusicMobile/Info.plist >/dev/null 2>&1; then
            echo 'ERROR: V8 must not contain UIApplicationSceneManifest.'
            exit 1
          fi
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes:0' ios/LxMusicMobile/Info.plist | grep -q '^audio$'

          grep -q '63VNAMT4FN.com.klxmc.music.mobile' "$CARPLAY_ENTITLEMENTS"
          grep -q '<key>com.apple.developer.carplay-audio</key>' "$CARPLAY_ENTITLEMENTS"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install ldid
        run: brew install ldid

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Lint CarPlay bridge
        run: npx eslint src/core/init/carPlay.ts src/utils/nativeModules/carPlay.ts src/app.ts src/navigation/regLaunchedEvent.ts

      - name: Install CocoaPods dependencies
        shell: bash
        run: |
          cd ios
          bundle exec pod install --repo-update

      - name: Read app version
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_VERSION_CODE=$(node -p "require('./package.json').versionCode")
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION_CODE=$PACKAGE_VERSION_CODE" >> "$GITHUB_ENV"

      - name: Build unsigned iOS application
        shell: bash
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild \
            -workspace "$IOS_WORKSPACE" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_IDENTIFIER" \
            MARKETING_VERSION="$PACKAGE_VERSION" \
            CURRENT_PROJECT_VERSION="$PACKAGE_VERSION_CODE" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build 2>&1 | tee build/xcodebuild.log

      - name: Locate and validate compiled app
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$DERIVED_DATA_PATH/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          EXECUTABLE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")"
          EXECUTABLE_PATH="$APP_PATH/$EXECUTABLE_NAME"
          test -f "$EXECUTABLE_PATH"
          test -s "$APP_PATH/main.jsbundle"

          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist" | grep -q '^com.klxmc.music.mobile$'
          if /usr/libexec/PlistBuddy -c 'Print :UIApplicationSceneManifest' "$APP_PATH/Info.plist" >/dev/null 2>&1; then
            echo 'ERROR: compiled V8 app contains UIApplicationSceneManifest.'
            exit 1
          fi
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes:0' "$APP_PATH/Info.plist" | grep -q '^audio$'

          strings "$EXECUTABLE_PATH" > build/app-strings.txt
          grep -q 'MPPlayableContentManager' build/app-strings.txt
          grep -q 'CarPlayModule' build/app-strings.txt
          ! grep -q 'LXPhoneSceneDelegate' build/app-strings.txt
          ! grep -q 'V7 returning dynamic CarPlay scene configuration' build/app-strings.txt

          /usr/bin/otool -L "$EXECUTABLE_PATH" > build/app-dylibs.txt
          grep -q '/MediaPlayer.framework/MediaPlayer' build/app-dylibs.txt

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "EXECUTABLE_PATH=$EXECUTABLE_PATH" >> "$GITHUB_ENV"

      - name: Sign embedded Mach-O code
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' candidate; do
            [ "$candidate" = "$EXECUTABLE_PATH" ] && continue
            kind="$(file -b "$candidate" 2>/dev/null || true)"
            case "$kind" in
              *Mach-O*) ldid -S "$candidate" ;;
            esac
          done < <(find "$APP_PATH" -type f -print0)

      - name: Sign app preserving original LX identity plus CarPlay
        shell: bash
        run: |
          set -euo pipefail
          ldid -S"$CARPLAY_ENTITLEMENTS" -M "$APP_PATH"
          ldid -e "$EXECUTABLE_PATH" > build/carplay-entitlements.plist
          plutil -lint build/carplay-entitlements.plist
          grep -q '63VNAMT4FN.com.klxmc.music.mobile' build/carplay-entitlements.plist
          grep -q '<key>com.apple.developer.team-identifier</key>' build/carplay-entitlements.plist
          grep -q '63VNAMT4FN' build/carplay-entitlements.plist
          grep -q '<key>com.apple.developer.carplay-audio</key>' build/carplay-entitlements.plist

      - name: Package V8 IPA and source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/Payload build/patched-source build/full-source
          mkdir -p build/Payload build/patched-source/ios/LxMusicMobile build/patched-source/.carplay-build
          cp -R "$APP_PATH" build/Payload/
          cp ios/LxMusicMobile/main.m build/patched-source/ios/LxMusicMobile/main.m
          cp ios/LxMusicMobile/Info.plist build/patched-source/ios/LxMusicMobile/Info.plist
          cp ios/LxMusicMobile/LxMusicMobile.entitlements build/patched-source/ios/LxMusicMobile/LxMusicMobile.entitlements
          cp src/core/init/carPlay.ts build/patched-source/carPlay.ts
          cp src/utils/nativeModules/carPlay.ts build/patched-source/carPlay-native-module.ts
          cp .carplay-build/apply_carplay_phonefix_v8.py build/patched-source/.carplay-build/apply_carplay_phonefix_v8.py

          cat > build/FINAL-V8-VERIFY.txt <<EOF
          LX Music CarPlay PhoneFix V8
          Bundle ID: $IOS_BUNDLE_IDENTIFIER
          Original LX Team ID: 63VNAMT4FN
          Phone lifecycle: legacy UIApplication/AppDelegate + ReactNativeNavigation only
          UIApplicationSceneManifest: ABSENT
          UIScene/CPTemplateApplicationScene code: ABSENT
          CarPlay provider: MPPlayableContentManager
          Pre-main CarPlay constructor: ABSENT
          Provider activation: explicit RN call after bootstrap/core init
          Entitlement: com.apple.developer.carplay-audio = true
          EOF

          mkdir -p "build/full-source/LXMusic-iOS-${PACKAGE_VERSION}-CarPlay-PhoneFixV8"
          rsync -a \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='ios/Pods' \
            --exclude='build' \
            ./ "build/full-source/LXMusic-iOS-${PACKAGE_VERSION}-CarPlay-PhoneFixV8/"

          cd build
          IPA_NAME="LXMusic-iOS-${PACKAGE_VERSION}-CarPlay-PhoneFixV8-TrollStore.ipa"
          PATCHED_SOURCE_NAME="LXMusic-iOS-${PACKAGE_VERSION}-CarPlay-PhoneFixV8-patched-source.zip"
          FULL_SOURCE_NAME="LXMusic-iOS-${PACKAGE_VERSION}-CarPlay-PhoneFixV8-full-source.zip"
          zip -qry "$IPA_NAME" Payload
          zip -qry "$PATCHED_SOURCE_NAME" patched-source
          (cd full-source && zip -qry "../$FULL_SOURCE_NAME" "LXMusic-iOS-${PACKAGE_VERSION}-CarPlay-PhoneFixV8")
          shasum -a 256 "$IPA_NAME" > "$IPA_NAME.sha256"
          shasum -a 256 "$PATCHED_SOURCE_NAME" > "$PATCHED_SOURCE_NAME.sha256"
          shasum -a 256 "$FULL_SOURCE_NAME" > "$FULL_SOURCE_NAME.sha256"

      - name: Upload V8 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LXMusic-CarPlay-PhoneFixV8
          compression-level: 6
          path: |
            build/LXMusic-iOS-*-CarPlay-PhoneFixV8-TrollStore.ipa
            build/LXMusic-iOS-*-CarPlay-PhoneFixV8-TrollStore.ipa.sha256
            build/LXMusic-iOS-*-CarPlay-PhoneFixV8-patched-source.zip
            build/LXMusic-iOS-*-CarPlay-PhoneFixV8-patched-source.zip.sha256
            build/LXMusic-iOS-*-CarPlay-PhoneFixV8-full-source.zip
            build/LXMusic-iOS-*-CarPlay-PhoneFixV8-full-source.zip.sha256
            build/carplay-entitlements.plist
            build/app-dylibs.txt
            build/app-strings.txt
            build/FINAL-V8-VERIFY.txt
          if-no-files-found: error

      - name: Upload Xcode log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-v8-${{ github.run_id }}
          path: build/xcodebuild.log
          if-no-files-found: ignore
