name: Build LX Music iOS IPA

on:
  push:
    branches: [main]
    paths-ignore:
      - 'build-info/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-device-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build TrollStore CarPlay IPA
    runs-on: macos-14
    env:
      NO_FLIPPER: 1
      IOS_SCHEME: LxMusicMobile
      IOS_WORKSPACE: ios/LxMusicMobile.xcworkspace
      IOS_BUNDLE_IDENTIFIER: cn.toside.music.mobile
      DERIVED_DATA_PATH: build/DerivedData
      CARPLAY_ENTITLEMENTS: ios/LxMusicMobile/LxMusicMobile.entitlements

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install ldid
        run: brew install ldid

      - name: Validate CarPlay source configuration
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint ios/LxMusicMobile/Info.plist
          plutil -lint "$CARPLAY_ENTITLEMENTS"

          # Stability-first CarPlay architecture: MediaPlayer playable content only.
          # Never opt this legacy ReactNativeNavigation phone app into a UIScene lifecycle.
          grep -q 'MPPlayableContentManager' ios/LxMusicMobile/main.m
          grep -q 'MPPlayableContentDataSource' ios/LxMusicMobile/main.m
          grep -q 'MPPlayableContentDelegate' ios/LxMusicMobile/main.m
          grep -q 'RCT_EXPORT_MODULE(CarPlayModule)' ios/LxMusicMobile/main.m
          grep -q 'carplay-action' ios/LxMusicMobile/main.m
          grep -q "playListById" src/core/init/carPlay.ts
          grep -q "carplay-action" src/utils/nativeModules/carPlay.ts

          if grep -q '@import CarPlay' ios/LxMusicMobile/main.m; then
            echo 'ERROR: CarPlay.framework scene integration must not be linked into the phone startup path.'
            exit 1
          fi
          if grep -q 'CPTemplateApplicationScene\|configurationForConnectingSceneSession\|CPTabBarTemplate\|CPListTemplate' ios/LxMusicMobile/main.m; then
            echo 'ERROR: UIScene-based CarPlay code found; this build must use MediaPlayer only.'
            exit 1
          fi
          if /usr/libexec/PlistBuddy -c 'Print :UIApplicationSceneManifest' ios/LxMusicMobile/Info.plist >/dev/null 2>&1; then
            echo 'ERROR: UIApplicationSceneManifest would hijack the phone ReactNativeNavigation lifecycle.'
            exit 1
          fi

          grep -q 'com.apple.developer.playable-content' "$CARPLAY_ENTITLEMENTS"
          if grep -q 'com.apple.developer.carplay-audio' "$CARPLAY_ENTITLEMENTS"; then
            echo 'ERROR: carplay-audio entitlement is intentionally disabled for the MediaPlayer-only build.'
            exit 1
          fi

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Lint CarPlay bridge
        run: npx eslint src/core/init/carPlay.ts src/utils/nativeModules/carPlay.ts src/app.ts src/navigation/regLaunchedEvent.ts

      - name: Verify sound-effect DSP patches
        run: npm run lint:sound-effect-dsp

      - name: Install CocoaPods dependencies
        shell: bash
        run: |
          cd ios
          bundle exec pod install --repo-update

      - name: Read app version
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_VERSION_CODE=$(node -p "require('./package.json').versionCode")
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION_CODE=$PACKAGE_VERSION_CODE" >> "$GITHUB_ENV"

      - name: Build unsigned iOS application
        shell: bash
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild \
            -workspace "$IOS_WORKSPACE" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_IDENTIFIER" \
            MARKETING_VERSION="$PACKAGE_VERSION" \
            CURRENT_PROJECT_VERSION="$PACKAGE_VERSION_CODE" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build 2>&1 | tee build/xcodebuild.log

      - name: Locate and verify compiled application
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$DERIVED_DATA_PATH/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          EXECUTABLE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")"
          EXECUTABLE_PATH="$APP_PATH/$EXECUTABLE_NAME"
          test -f "$EXECUTABLE_PATH"

          strings "$EXECUTABLE_PATH" > build/app-strings.txt
          grep -q 'CarPlayModule' build/app-strings.txt
          grep -q 'LXPlayableContentCoordinator' build/app-strings.txt
          grep -q 'carplay-action' build/app-strings.txt
          grep -q 'refresh-library' build/app-strings.txt
          if grep -q 'LXCarPlaySceneDelegate\|CPTemplateApplicationScene' build/app-strings.txt; then
            echo 'ERROR: scene-based CarPlay symbols leaked into final binary.'
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "EXECUTABLE_PATH=$EXECUTABLE_PATH" >> "$GITHUB_ENV"

      - name: Validate runtime closure and sign embedded code
        shell: bash
        run: |
          set -euo pipefail
          test -s "$APP_PATH/main.jsbundle"
          file "$APP_PATH/main.jsbundle" | tee build/main-jsbundle-type.txt

          /usr/bin/otool -L "$EXECUTABLE_PATH" > build/app-dylibs.txt
          awk '$1 ~ /^@rpath\/.*\.framework\// {print $1}' build/app-dylibs.txt > build/app-rpath-frameworks.txt

          while IFS= read -r dependency; do
            [ -n "$dependency" ] || continue
            relative="${dependency#@rpath/}"
            if [ ! -f "$APP_PATH/Frameworks/$relative" ]; then
              echo "ERROR: unresolved app runtime dependency: $dependency"
              exit 1
            fi
          done < build/app-rpath-frameworks.txt

          if grep -Fq '@rpath/hermes.framework/hermes' build/app-rpath-frameworks.txt; then
            test -f "$APP_PATH/Frameworks/hermes.framework/hermes" || {
              echo 'ERROR: Hermes is linked by the app but missing from Frameworks.'
              exit 1
            }
          fi

          : > build/embedded-mach-o.txt
          : > build/embedded-code-signatures.txt
          while IFS= read -r -d '' candidate; do
            [ "$candidate" = "$EXECUTABLE_PATH" ] && continue
            kind="$(file -b "$candidate" 2>/dev/null || true)"
            case "$kind" in
              *Mach-O*)
                echo "$candidate" >> build/embedded-mach-o.txt
                ldid -S "$candidate"
                /usr/bin/otool -l "$candidate" > build/load-commands.tmp
                grep -q 'LC_CODE_SIGNATURE' build/load-commands.tmp || {
                  echo "ERROR: embedded Mach-O still has no code signature: $candidate"
                  exit 1
                }
                echo "SIGNED $candidate" >> build/embedded-code-signatures.txt
                ;;
            esac
          done < <(find "$APP_PATH" -type f -print0)
          rm -f build/load-commands.tmp

          test -s build/embedded-mach-o.txt
          if grep -Fq '@rpath/hermes.framework/hermes' build/app-rpath-frameworks.txt; then
            /usr/bin/otool -l "$APP_PATH/Frameworks/hermes.framework/hermes" > build/hermes-load-commands.txt
            grep -q 'LC_CODE_SIGNATURE' build/hermes-load-commands.txt
          fi

      - name: Inject TrollStore playable-content entitlement
        shell: bash
        run: |
          set -euo pipefail
          ldid -S"$CARPLAY_ENTITLEMENTS" "$EXECUTABLE_PATH"
          ldid -e "$EXECUTABLE_PATH" > build/carplay-entitlements.plist
          plutil -lint build/carplay-entitlements.plist
          grep -q 'com.apple.developer.playable-content' build/carplay-entitlements.plist
          if grep -q 'com.apple.developer.carplay-audio' build/carplay-entitlements.plist; then
            echo 'ERROR: unexpected scene-based CarPlay entitlement in final binary.'
            exit 1
          fi
          /usr/bin/otool -l "$EXECUTABLE_PATH" > build/main-load-commands.txt
          grep -q 'LC_CODE_SIGNATURE' build/main-load-commands.txt

      - name: Package TrollStore CarPlay IPA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          IPA_NAME="LXMusic-iOS-${PACKAGE_VERSION}-CarPlay-TrollStore.ipa"
          zip -qry "$IPA_NAME" Payload
          shasum -a 256 "$IPA_NAME" > "$IPA_NAME.sha256"
          unzip -l "$IPA_NAME" > "$IPA_NAME.contents.txt"
          grep -q '/Frameworks/hermes.framework/hermes' "$IPA_NAME.contents.txt"
          grep -q '/main.jsbundle' "$IPA_NAME.contents.txt"

      - name: Upload CarPlay IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LXMusic-iOS-${{ env.PACKAGE_VERSION }}-CarPlay-TrollStore
          path: |
            build/LXMusic-iOS-${{ env.PACKAGE_VERSION }}-CarPlay-TrollStore.ipa
            build/LXMusic-iOS-${{ env.PACKAGE_VERSION }}-CarPlay-TrollStore.ipa.sha256
            build/LXMusic-iOS-${{ env.PACKAGE_VERSION }}-CarPlay-TrollStore.ipa.contents.txt
            build/carplay-entitlements.plist
            build/app-dylibs.txt
            build/app-rpath-frameworks.txt
            build/embedded-code-signatures.txt
            build/main-jsbundle-type.txt
          if-no-files-found: error

      - name: Upload Xcode log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-${{ github.run_id }}
          path: build/xcodebuild.log
          if-no-files-found: ignore

      - name: Record build run
        if: always()
        shell: bash
        env:
          BUILD_STATUS: ${{ job.status }}
        run: |
          mkdir -p build-info
          VERSION="${PACKAGE_VERSION:-unknown}"
          printf '%s\n' "run_id=${GITHUB_RUN_ID}" > build-info/last-run.txt
          printf '%s\n' "status=${BUILD_STATUS}" >> build-info/last-run.txt
          printf '%s\n' "version=${VERSION}" >> build-info/last-run.txt
          printf '%s\n' "artifact=LXMusic-iOS-${VERSION}-CarPlay-TrollStore" >> build-info/last-run.txt
          printf '%s\n' "commit=${GITHUB_SHA}" >> build-info/last-run.txt
          if [ "$BUILD_STATUS" = "success" ]; then
            cp build-info/last-run.txt build-info/last-success.txt
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-info/last-run.txt build-info/last-success.txt 2>/dev/null || git add build-info/last-run.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record iOS build ${BUILD_STATUS} [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main || echo 'Build-info push skipped because repository advanced.'
          fi
