name: Build LX Music iOS IPA

on:
  push:
    branches: [main]
    paths-ignore:
      - 'build-info/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build TrollStore CarPlay IPA
    runs-on: macos-14
    env:
      NO_FLIPPER: 1
      IOS_SCHEME: LxMusicMobile
      IOS_WORKSPACE: ios/LxMusicMobile.xcworkspace
      IOS_BUNDLE_IDENTIFIER: cn.toside.music.mobile
      DERIVED_DATA_PATH: build/DerivedData
      CARPLAY_ENTITLEMENTS: ios/LxMusicMobile/LxMusicMobile.entitlements

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install ldid
        run: brew install ldid

      - name: Validate CarPlay source configuration
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint ios/LxMusicMobile/Info.plist
          plutil -lint "$CARPLAY_ENTITLEMENTS"

          grep -q 'configurationForConnectingSceneSession' ios/LxMusicMobile/main.m
          grep -q 'CPTemplateApplicationSceneSessionRoleApplication' ios/LxMusicMobile/main.m
          grep -q 'setRootTemplate:self.tabBarTemplate' ios/LxMusicMobile/main.m
          grep -q 'CPTabBarTemplate' ios/LxMusicMobile/main.m
          grep -q 'CPNowPlayingTemplate' ios/LxMusicMobile/main.m
          grep -q 'RCT_EXPORT_MODULE(CarPlayModule)' ios/LxMusicMobile/main.m
          grep -q 'maximumItemCount' ios/LxMusicMobile/main.m
          grep -q 'maximumTabCount' ios/LxMusicMobile/main.m
          grep -q 'LXCarPlayLibraryDidChange' ios/LxMusicMobile/main.m
          grep -q "initCarPlay" src/core/init/index.ts
          grep -q "playListById" src/core/init/carPlay.ts
          grep -q "carplay-action" src/utils/nativeModules/carPlay.ts

          # CPSearchTemplate belongs to the navigation CarPlay category. Keep the audio
          # implementation on List/TabBar/NowPlaying templates to avoid entitlement mismatch.
          if grep -q 'CPSearchTemplate' ios/LxMusicMobile/main.m; then
            echo 'ERROR: navigation-only CPSearchTemplate found in audio CarPlay implementation.'
            exit 1
          fi

          # Keep the phone UI on ReactNativeNavigation's existing lifecycle. A global
          # UIApplicationSceneManifest can make the phone scene bypass RNN and black-screen.
          if /usr/libexec/PlistBuddy -c 'Print :UIApplicationSceneManifest' ios/LxMusicMobile/Info.plist >/dev/null 2>&1; then
            echo 'ERROR: UIApplicationSceneManifest would hijack the phone ReactNativeNavigation lifecycle.'
            exit 1
          fi

          grep -q 'com.apple.developer.carplay-audio' "$CARPLAY_ENTITLEMENTS"
          grep -q 'com.apple.developer.playable-content' "$CARPLAY_ENTITLEMENTS"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Lint CarPlay bridge
        run: npx eslint src/core/init/carPlay.ts src/utils/nativeModules/carPlay.ts

      - name: Verify sound-effect DSP patches
        run: npm run lint:sound-effect-dsp

      - name: Install CocoaPods dependencies
        shell: bash
        run: |
          cd ios
          bundle exec pod install --repo-update

      - name: Read app version
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_VERSION_CODE=$(node -p "require('./package.json').versionCode")
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION_CODE=$PACKAGE_VERSION_CODE" >> "$GITHUB_ENV"

      - name: Build unsigned iOS application
        shell: bash
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild \
            -workspace "$IOS_WORKSPACE" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_IDENTIFIER" \
            MARKETING_VERSION="$PACKAGE_VERSION" \
            CURRENT_PROJECT_VERSION="$PACKAGE_VERSION_CODE" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build 2>&1 | tee build/xcodebuild.log

      - name: Locate and verify compiled application
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$DERIVED_DATA_PATH/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          EXECUTABLE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")"
          EXECUTABLE_PATH="$APP_PATH/$EXECUTABLE_NAME"
          test -f "$EXECUTABLE_PATH"

          # Verify the native CarPlay classes/bridge survived the Release link step.
          strings "$EXECUTABLE_PATH" | grep -q 'CarPlayModule'
          strings "$EXECUTABLE_PATH" | grep -q 'LXCarPlaySceneDelegate'
          strings "$EXECUTABLE_PATH" | grep -q 'carplay-action'
          strings "$EXECUTABLE_PATH" | grep -q 'refresh-library'
          strings "$EXECUTABLE_PATH" | grep -q 'LXCarPlayLibraryDidChange'

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "EXECUTABLE_PATH=$EXECUTABLE_PATH" >> "$GITHUB_ENV"

      - name: Inject TrollStore CarPlay entitlements
        shell: bash
        run: |
          set -euo pipefail
          ldid -S"$CARPLAY_ENTITLEMENTS" "$EXECUTABLE_PATH"
          ldid -e "$EXECUTABLE_PATH" > build/carplay-entitlements.plist
          plutil -lint build/carplay-entitlements.plist
          grep -q 'com.apple.developer.carplay-audio' build/carplay-entitlements.plist
          grep -q 'com.apple.developer.playable-content' build/carplay-entitlements.plist

      - name: Package TrollStore CarPlay IPA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          IPA_NAME="LXMusic-iOS-${PACKAGE_VERSION}-CarPlay-TrollStore.ipa"
          zip -qry "$IPA_NAME" Payload
          shasum -a 256 "$IPA_NAME" > "$IPA_NAME.sha256"

      - name: Upload CarPlay IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LXMusic-iOS-${{ env.PACKAGE_VERSION }}-CarPlay-TrollStore
          path: |
            build/LXMusic-iOS-${{ env.PACKAGE_VERSION }}-CarPlay-TrollStore.ipa
            build/LXMusic-iOS-${{ env.PACKAGE_VERSION }}-CarPlay-TrollStore.ipa.sha256
            build/carplay-entitlements.plist
          if-no-files-found: error

      - name: Upload Xcode log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-${{ github.run_id }}
          path: build/xcodebuild.log
          if-no-files-found: ignore

      - name: Record build run
        if: always()
        shell: bash
        env:
          BUILD_STATUS: ${{ job.status }}
        run: |
          mkdir -p build-info
          VERSION="${PACKAGE_VERSION:-unknown}"
          printf '%s\n' "run_id=${GITHUB_RUN_ID}" > build-info/last-run.txt
          printf '%s\n' "status=${BUILD_STATUS}" >> build-info/last-run.txt
          printf '%s\n' "version=${VERSION}" >> build-info/last-run.txt
          printf '%s\n' "artifact=LXMusic-iOS-${VERSION}-CarPlay-TrollStore" >> build-info/last-run.txt
          printf '%s\n' "commit=${GITHUB_SHA}" >> build-info/last-run.txt
          if [ "$BUILD_STATUS" = "success" ]; then
            cp build-info/last-run.txt build-info/last-success.txt
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-info/last-run.txt build-info/last-success.txt 2>/dev/null || git add build-info/last-run.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record iOS build ${BUILD_STATUS} [skip ci]"
            git push origin HEAD:main
          fi
