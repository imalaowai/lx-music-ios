# bootstrap revision 2
name: Bootstrap LX Music iOS Source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import iOS adaptation and merge v1.8.4
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/lx-src
          git clone --branch ios-adaptation --single-branch https://github.com/Q-1515/lx-music-mobile.git /tmp/lx-src
          cd /tmp/lx-src
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add official https://github.com/lyswhut/lx-music-mobile.git
          git fetch --tags official v1.8.4
          git merge --no-ff --no-edit -X ours v1.8.4 || {
            git merge --abort || true
            echo "Automatic merge failed; keeping iOS adaptation source and applying official v1.8.4 package metadata."
          }

          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('package.json')
          data=json.loads(p.read_text())
          data['version']='1.8.4'
          data['versionCode']=76
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n')
          PY

          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          rsync -a --exclude='.git' /tmp/lx-src/ "$GITHUB_WORKSPACE"/
          cd "$GITHUB_WORKSPACE"

          mkdir -p .github/workflows
          rm -f .github/workflows/bootstrap-source.yml
          cat > .github/workflows/build-ios-unsigned.yml <<'YAML'
          name: Build iOS Unsigned IPA

          on:
            push:
              branches: [main]
            workflow_dispatch:

          jobs:
            build:
              runs-on: macos-14
              env:
                NO_FLIPPER: 1
                IOS_SCHEME: LxMusicMobile
                IOS_WORKSPACE: ios/LxMusicMobile.xcworkspace
                IOS_BUNDLE_IDENTIFIER: cn.toside.music.mobile
                DERIVED_DATA_PATH: build/DerivedData
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version-file: .nvmrc
                    cache: npm
                - uses: ruby/setup-ruby@v1
                  with:
                    ruby-version: '3.2'
                    bundler-cache: true
                - name: Install JS dependencies
                  run: npm ci
                - name: Install CocoaPods dependencies
                  run: |
                    cd ios
                    bundle exec pod install --repo-update
                - name: Read version
                  run: |
                    echo "PACKAGE_VERSION=$(node -p \"require('./package.json').version\")" >> "$GITHUB_ENV"
                    echo "PACKAGE_VERSION_CODE=$(node -p \"require('./package.json').versionCode\")" >> "$GITHUB_ENV"
                - name: Build unsigned app
                  run: |
                    mkdir -p build
                    set -o pipefail
                    xcodebuild \
                      -workspace "$IOS_WORKSPACE" \
                      -scheme "$IOS_SCHEME" \
                      -configuration Release \
                      -sdk iphoneos \
                      -destination 'generic/platform=iOS' \
                      -derivedDataPath "$DERIVED_DATA_PATH" \
                      PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_IDENTIFIER" \
                      MARKETING_VERSION="$PACKAGE_VERSION" \
                      CURRENT_PROJECT_VERSION="$PACKAGE_VERSION_CODE" \
                      CODE_SIGNING_ALLOWED=NO \
                      CODE_SIGNING_REQUIRED=NO \
                      clean build 2>&1 | tee build/xcodebuild.log
                - name: Upload build log on failure
                  if: failure()
                  uses: actions/upload-artifact@v4
                  with:
                    name: xcodebuild-log
                    path: build/xcodebuild.log
                    if-no-files-found: ignore
                - name: Package IPA
                  run: |
                    APP_PATH="$(find "$DERIVED_DATA_PATH/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
                    test -n "$APP_PATH"
                    rm -rf build/Payload
                    mkdir -p build/Payload
                    cp -R "$APP_PATH" build/Payload/
                    cd build
                    zip -qry "LXMusic-iOS-${PACKAGE_VERSION}-unsigned.ipa" Payload
                - name: Upload unsigned IPA
                  uses: actions/upload-artifact@v4
                  with:
                    name: LXMusic-iOS-${{ env.PACKAGE_VERSION }}-unsigned
                    path: build/LXMusic-iOS-${{ env.PACKAGE_VERSION }}-unsigned.ipa
          YAML

          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import full iOS source and merge upstream v1.8.4"
          git push --force origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
