name: Bootstrap LX Music iOS Source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download iOS adaptation source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/lx-src
          git clone --depth 1 --branch ios-adaptation --single-branch https://github.com/Q-1515/lx-music-mobile.git /tmp/lx-src

      - name: Import complete source tree
        shell: bash
        run: |
          set -euxo pipefail
          # Keep this repository's workflows. GITHUB_TOKEN may not push
          # workflow files copied from another repository.
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            /tmp/lx-src/ ./

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'Import complete iOS adaptation source'
            git push origin HEAD:main
          fi
