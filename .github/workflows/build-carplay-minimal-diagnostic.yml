name: Build CarPlay Minimal Diagnostic

on:
  push:
    branches: [carplay-minimal-diagnostic-20260829]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Build minimal native CarPlay app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf diagnostic-build
          mkdir -p diagnostic-build/CarPlayDiagnostic.app diagnostic-build/Payload

          cat > diagnostic-build/main.m <<'EOF'
          #import <UIKit/UIKit.h>
          #import <CarPlay/CarPlay.h>

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @end

          @interface PhoneSceneDelegate : UIResponder <UIWindowSceneDelegate>
          @property (nonatomic, strong) UIWindow *window;
          @end

          @interface CarPlaySceneDelegate : UIResponder <CPTemplateApplicationSceneDelegate>
          @property (nonatomic, strong) CPInterfaceController *interfaceController;
          @end

          @implementation AppDelegate
          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
            return YES;
          }
          @end

          @implementation PhoneSceneDelegate
          - (void)scene:(UIScene *)scene willConnectToSession:(UISceneSession *)session options:(UISceneConnectionOptions *)connectionOptions {
            if (![scene isKindOfClass:UIWindowScene.class]) return;
            UIWindow *window = [[UIWindow alloc] initWithWindowScene:(UIWindowScene *)scene];
            UIViewController *vc = [UIViewController new];
            vc.view.backgroundColor = UIColor.systemBackgroundColor;
            UILabel *label = [[UILabel alloc] initWithFrame:CGRectZero];
            label.text = @"CarPlay Diagnostic";
            label.textAlignment = NSTextAlignmentCenter;
            label.translatesAutoresizingMaskIntoConstraints = NO;
            [vc.view addSubview:label];
            [NSLayoutConstraint activateConstraints:@[
              [label.centerXAnchor constraintEqualToAnchor:vc.view.centerXAnchor],
              [label.centerYAnchor constraintEqualToAnchor:vc.view.centerYAnchor]
            ]];
            window.rootViewController = vc;
            self.window = window;
            [window makeKeyAndVisible];
          }
          @end

          @implementation CarPlaySceneDelegate
          - (void)templateApplicationScene:(CPTemplateApplicationScene *)templateApplicationScene didConnectInterfaceController:(CPInterfaceController *)interfaceController API_AVAILABLE(ios(14.0)) {
            self.interfaceController = interfaceController;
            CPListItem *item = [[CPListItem alloc] initWithText:@"CarPlay OK" detailText:@"Minimal TrollStore diagnostic app"];
            CPListSection *section = [[CPListSection alloc] initWithItems:@[item]];
            CPListTemplate *root = [[CPListTemplate alloc] initWithTitle:@"Diagnostic" sections:@[section]];
            [interfaceController setRootTemplate:root animated:NO completion:nil];
          }
          - (void)templateApplicationScene:(CPTemplateApplicationScene *)templateApplicationScene didDisconnectInterfaceController:(CPInterfaceController *)interfaceController API_AVAILABLE(ios(14.0)) {
            self.interfaceController = nil;
          }
          @end

          int main(int argc, char * argv[]) {
            @autoreleasepool {
              return UIApplicationMain(argc, argv, nil, NSStringFromClass(AppDelegate.class));
            }
          }
          EOF

          cat > diagnostic-build/CarPlayDiagnostic.app/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleDevelopmentRegion</key><string>en</string>
            <key>CFBundleDisplayName</key><string>CarPlay Diagnostic</string>
            <key>CFBundleExecutable</key><string>CarPlayDiagnostic</string>
            <key>CFBundleIdentifier</key><string>com.imalaowai.carplaydiagnostic</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>CarPlay Diagnostic</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>MinimumOSVersion</key><string>14.0</string>
            <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
            <key>UIBackgroundModes</key><array><string>audio</string></array>
            <key>UIApplicationSceneManifest</key>
            <dict>
              <key>UIApplicationSupportsMultipleScenes</key><true/>
              <key>UISceneConfigurations</key>
              <dict>
                <key>UIWindowSceneSessionRoleApplication</key>
                <array><dict>
                  <key>UISceneClassName</key><string>UIWindowScene</string>
                  <key>UISceneConfigurationName</key><string>Phone</string>
                  <key>UISceneDelegateClassName</key><string>PhoneSceneDelegate</string>
                </dict></array>
                <key>CPTemplateApplicationSceneSessionRoleApplication</key>
                <array><dict>
                  <key>UISceneClassName</key><string>CPTemplateApplicationScene</string>
                  <key>UISceneConfigurationName</key><string>CarPlay</string>
                  <key>UISceneDelegateClassName</key><string>CarPlaySceneDelegate</string>
                </dict></array>
              </dict>
            </dict>
            <key>UISupportedInterfaceOrientations</key><array><string>UIInterfaceOrientationPortrait</string></array>
          </dict></plist>
          EOF

          cat > diagnostic-build/CarPlay.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.developer.carplay-audio</key><true/>
          </dict></plist>
          EOF

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -fobjc-arc \
            -framework Foundation -framework UIKit -framework CarPlay \
            diagnostic-build/main.m \
            -o diagnostic-build/CarPlayDiagnostic.app/CarPlayDiagnostic

          plutil -lint diagnostic-build/CarPlayDiagnostic.app/Info.plist
          ldid -Sdiagnostic-build/CarPlay.entitlements -M diagnostic-build/CarPlayDiagnostic.app
          ldid -e diagnostic-build/CarPlayDiagnostic.app/CarPlayDiagnostic > diagnostic-build/final-entitlements.plist
          plutil -lint diagnostic-build/final-entitlements.plist
          grep -q 'com.apple.developer.carplay-audio' diagnostic-build/final-entitlements.plist

          /usr/bin/otool -L diagnostic-build/CarPlayDiagnostic.app/CarPlayDiagnostic > diagnostic-build/dylibs.txt
          grep -q '/CarPlay.framework/CarPlay' diagnostic-build/dylibs.txt
          strings diagnostic-build/CarPlayDiagnostic.app/CarPlayDiagnostic | grep -q 'CarPlaySceneDelegate'

          cp -R diagnostic-build/CarPlayDiagnostic.app diagnostic-build/Payload/
          cd diagnostic-build
          zip -qry CarPlay-Minimal-Diagnostic-TrollStore.ipa Payload
          shasum -a 256 CarPlay-Minimal-Diagnostic-TrollStore.ipa > CarPlay-Minimal-Diagnostic-TrollStore.ipa.sha256

      - name: Upload diagnostic IPA
        uses: actions/upload-artifact@v4
        with:
          name: CarPlay-Minimal-Diagnostic
          path: |
            diagnostic-build/CarPlay-Minimal-Diagnostic-TrollStore.ipa
            diagnostic-build/CarPlay-Minimal-Diagnostic-TrollStore.ipa.sha256
            diagnostic-build/final-entitlements.plist
            diagnostic-build/dylibs.txt
          if-no-files-found: error
