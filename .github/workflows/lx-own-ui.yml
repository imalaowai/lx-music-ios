name: LX Own UI Rooms Chat Native IPA Components
# Lock-screen transition clock and remote-command recovery regressions are exercised by lockscreen-carplay.
on:
  push:
    branches: [codex/native-web-carplay, fix/lockscreen-progress-clock]
    paths: ['OwnUI/**', 'NativeCompanion/Sources/**', 'NativeCompanion/Resources/**', 'NativeCompanion/WebOverrides/**', 'FullReference/**', '.github/workflows/lx-own-ui.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lx-own-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  interface:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python3 OwnUI/scripts/prepare.py
          node --test OwnUI/Tests/audio-driver.test.cjs NativeCompanion/Tests/bridge.test.cjs NativeCompanion/Tests/lyrics.test.cjs NativeCompanion/Tests/engine.test.cjs
          npm install --prefix /tmp/lx-ui-review playwright@1.62.1
          /tmp/lx-ui-review/node_modules/.bin/playwright install chromium webkit
          LX_PLAYWRIGHT=/tmp/lx-ui-review/node_modules/playwright node NativeCompanion/Tests/ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LX-OwnUI-Interface-Review
          path: NativeCompanion/build/ui-review/
          if-no-files-found: ignore
  native:
    # Both jobs are required; compile in parallel so UI review does not delay native diagnostics.
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install matching React Native bridge dependencies
        run: |
          git config --global url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:
          npm ci
      - name: Build integrated owned phone UI and native reference audio adapter
        run: bash OwnUI/scripts/build.sh
      - name: Check room ordering and native cache
        run: |
          xcrun swiftc NativeCompanion/Sources/Core.swift NativeCompanion/Tests/main.swift -o build/own-ui/core-tests
          build/own-ui/core-tests
          clang -fobjc-arc -fblocks -framework Foundation -I FullReference/Sources FullReference/Sources/LXFullLibrary.m FullReference/Tests/library.m -o build/own-ui/library-tests
          build/own-ui/library-tests
      - uses: actions/upload-artifact@v4
        with:
          name: LX-OwnUI-Native-Components
          path: build/own-ui/LX-OwnUI-Native-Components.zip
          if-no-files-found: error
  startup-playback:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 OwnUI/scripts/prepare.py
      - name: Verify restored-account playlist rendering and native playback in iOS Simulator
        timeout-minutes: 10
        run: bash OwnUI/scripts/check-phone.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LX-OwnUI-Phone-Launch
          path: |
            build/own-ui/own-phone-launch.png
            build/own-ui/own-phone-ready.json
            build/own-ui/offline-playback.json
            build/own-ui/player-route-checks.json
            build/own-ui/playlist-startup-checks.json
            build/own-ui/offline-checkpoint.json
            build/own-ui/own-phone-handshake.json
            build/own-ui/own-phone-runtime.log
          if-no-files-found: ignore
  provider-http:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 OwnUI/scripts/prepare.py
      - name: Verify native form bytes against a strict HTTP server
        working-directory: NativeCompanion
        run: |
          mkdir -p build
          git show b5573e2df5139e0b08da02ab90b94a99dccb030a:NativeCompanion/Sources/LocalEngine.swift > build/LegacyLocalEngine.swift
          xcrun swiftc Sources/Core.swift build/LegacyLocalEngine.swift Tests/engine-native.swift -o build/legacy-form-tests
          if node Tests/engine-http.cjs build/legacy-form-tests > build/legacy-form-regression.log 2>&1; then
            echo 'ERROR: old encoder unexpectedly passed the strict ciphertext fixture'
            exit 1
          fi
          python3 -c "from pathlib import Path; assert 'Form ciphertext changed in native HTTP bridge' in Path('build/legacy-form-regression.log').read_text()"
          echo 'Confirmed: the previous native encoder corrupts form ciphertext.'
          xcrun swiftc Sources/Core.swift Sources/LocalEngine.swift Tests/engine-native.swift -o build/engine-native-tests
          node Tests/engine-http.cjs build/engine-native-tests
      - name: Verify live playlists through production JavaScriptCore and URLSession
        working-directory: NativeCompanion
        run: |
          xcrun swiftc Sources/Core.swift Sources/LocalEngine.swift ../OwnUI/Tests/LiveCatalogue.swift -o build/live-catalogue-tests
          build/live-catalogue-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LX-OwnUI-Provider-HTTP
          path: NativeCompanion/build/provider-live-checks.json
          if-no-files-found: ignore
  lockscreen-carplay:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Exercise production lock-screen ownership and CarPlay lifecycle in iOS Simulator
        timeout-minutes: 10
        run: bash OwnUI/scripts/check-carplay.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LX-OwnUI-LockScreen-CarPlay
          path: build/own-ui/carplay-lifecycle.json
          if-no-files-found: ignore
